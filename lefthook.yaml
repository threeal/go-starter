pre-commit:
  piped: true
  fail_on_changes: always
  fail_on_changes_diff: true
  jobs:
    - name: tidy dependencies
      run: go mod tidy

    - name: tidy tool dependencies
      root: tools/
      run: go mod tidy

    - name: fix lint
      run: go tool -modfile=tools/go.mod golangci-lint run --fix

    - name: fix go formatting
      run: go fmt ./...

    - name: fix formatting
      run: dprint fmt
