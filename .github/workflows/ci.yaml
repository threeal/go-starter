name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Lefthook
        uses: threeal/setup-lefthook-action@v1.0.0

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Check pre-commit hook
        run: lefthook run pre-commit --all-files

      - name: Test
        run: go test -v ./... -coverprofile=.cover.out -covermode=atomic -coverpkg=./...

      - name: Check coverage
        run: go tool go-test-coverage -p .cover.out -f 100 -k 100 -t 100
